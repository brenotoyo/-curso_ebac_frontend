<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS" />
<!--<script src="https://cdn.jsdelivr.net/npm/less@4"></script>-->
</head>
<body>
    <main>
        <h1>Somador</h1>
        <form id="form-somador">
            <div class="numeros">
                <div class="primeiro">
                    <label for="primeiro-numero">Primeiro número: </label>
                    <input type="number" id="primeiro-numero" required min = "0" value="0" step="1">
                </div>
                <div class="segundo">
                    <label for="segundo-numero">Segundo número: </label>
                    <input type="number" id="segundo-numero" required min = "0" value="0" step="1">
                </div>
            </div>
            <button type="submit">Somar números</button>
        </form>
        <div class="resultado">
            A soma dos números é: <span id="resultado-valor"></span>
        </div>
    </main>
    <script src="@@ENDERECO_DO_JS"></script>
</body>
</html>
